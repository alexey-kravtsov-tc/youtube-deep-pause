<!DOCTYPE html>
<html>
<head>
  <title>YouTube Deep Pause Settings</title>
  <style>
    body { font-family: sans-serif; padding: 20px; max-width: 400px; }
    input { width: 100%; padding: 8px; margin: 10px 0; box-sizing: border-box; }
    button { padding: 8px 16px; background: #0f0f0f; color: white; border: none; border-radius: 4px; cursor: pointer; }
    button:hover { background: #333; }
    #status { margin-top: 10px; color: green; font-size: 14px; }
  </style>
</head>
<body>
  <h2>Settings</h2>
  <label for="apiKey">Gemini API Key:</label>
  <input type="password" id="apiKey" placeholder="Enter your Gemini API Key">
  <button id="save">Save</button>
  <div id="status"></div>
  
  <p style="font-size: 12px; color: #666; margin-top: 20px;">
    Get your key from <a href="https://aistudio.google.com/apikey" target="_blank">Google AI Studio</a>.
  </p>

  <script src="options.js"></script>
</body>
</html>
